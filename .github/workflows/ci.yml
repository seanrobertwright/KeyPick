name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ts
        run: bun run typecheck

      - name: Smoke test (--help)
        working-directory: ts
        run: bun run src/main.ts --help

      # The integration tests build a real sops/age vault. Versions match
      # SOPS_VERSION and AGE_VERSION in ts/src/commands/setup/prerequisites.ts.
      - name: Install sops and age
        env:
          SOPS_VERSION: 3.9.4
          SOPS_SHA256: 5488e32bc471de7982ad895dd054bbab3ab91c417a118426134551e9626e4e85
          AGE_VERSION: 1.2.0
          AGE_SHA256: 2ae71cb3ea761118937a944083f057cfd42f0ef11d197ce72fc2b8780d50c4ef
        run: |
          set -euo pipefail
          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"

          curl -fsSL -o "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/sops" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/sops" "$bindir/sops"

          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" "$bindir/"

          echo "$bindir" >> "$GITHUB_PATH"

      - name: Test
        working-directory: ts
        run: bun run test

  workflow-asset-sync:
    name: Workflow asset sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ts/src/assets/vault-sync.yml matches .github/workflows/vault-sync.yml
        run: |
          if ! diff -q .github/workflows/vault-sync.yml ts/src/assets/vault-sync.yml; then
            echo "::error::ts/src/assets/vault-sync.yml is out of sync with .github/workflows/vault-sync.yml."
            echo "Run: cp .github/workflows/vault-sync.yml ts/src/assets/vault-sync.yml"
            exit 1
          fi
